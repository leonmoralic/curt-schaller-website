name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
        # outputs dist/ — that's the whole static site

      # The Node-based FTP action keeps timing out on Hostinger's FTP
      # banner; lftp is the more battle-tested Unix client with proper
      # retries, passive-mode handling, and parallel uploads.
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Hostinger via lftp
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.HOSTINGER_FTP_SERVER_DIR || '/public_html/' }}
        run: |
          lftp -d -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set ftp:use-feat no;
            set ftp:prefer-epsv false;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            set cmd:fail-exit yes;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror -R --parallel=4 --verbose --delete-first=false ./dist/ \"$FTP_DIR\";
            bye
          "
